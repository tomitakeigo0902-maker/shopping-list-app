<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#24272f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="買い物リスト">
  <link rel="manifest" href="manifest.json?v=18">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>買い物リスト</title>
  <link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <h1 class="header__title">🛒 買い物リスト</h1>
    <span class="sync-status" id="syncStatus"></span>
    <button class="header__action" id="syncSettingsBtn" aria-label="同期設定">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.14.36.4.66.73.87.33.2.71.31 1.1.31H21a2 2 0 0 1 0 4h-.09c-.39 0-.77.11-1.1.31-.33.21-.59.51-.73.87z"></path>
      </svg>
    </button>
    <button class="header__action" id="headerAction" aria-label="完了済みを削除" style="display:none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
  </header>

  <!-- モード切替: やること / 買い物 -->
  <div class="mode-switch" id="modeSwitch">
    <button class="mode-btn mode-btn--active" data-mode="todo">やること<span class="mode-badge" id="todoCount"></span></button>
    <button class="mode-btn" data-mode="shop">🛒 買い物</button>
  </div>

  <!-- View: やること -->
  <main class="view" id="viewTodo">
    <div class="todo-filters">
      <button class="todo-filter todo-filter--active" data-filter="active">未完了</button>
      <button class="todo-filter" data-filter="all">すべて</button>
      <button class="todo-filter" data-filter="done">完了</button>
    </div>
    <div class="todo-list" id="todoList"></div>
    <div class="empty-state" id="todoEmpty" style="display:none;">
      <div class="empty-state__icon">✅</div>
      <p class="empty-state__title">やることはありません</p>
      <p class="empty-state__sub">Claudeに頼むとここに追加されます</p>
    </div>
  </main>

  <!-- View: List -->
  <main class="view view--active" id="viewList">
    <div class="item-list" id="itemList"></div>
    <div class="empty-state" id="emptyList">
      <div class="empty-state__icon">🛍️</div>
      <p class="empty-state__title">リストは空です</p>
      <p class="empty-state__sub">＋ボタンで商品を追加しましょう</p>
    </div>
  </main>

  <!-- View: History -->
  <main class="view" id="viewHistory">
    <div class="history-list" id="historyList"></div>
    <div class="empty-state" id="emptyHistory">
      <div class="empty-state__icon">📋</div>
      <p class="empty-state__title">履歴はまだありません</p>
      <p class="empty-state__sub">買い物を完了すると履歴に記録されます</p>
    </div>
  </main>

  <!-- View: Favorites -->
  <main class="view" id="viewFavorites">
    <div class="favorites-list" id="favoritesList"></div>
    <div class="empty-state" id="emptyFavorites">
      <div class="empty-state__icon">⭐</div>
      <p class="empty-state__title">お気に入りはまだありません</p>
      <p class="empty-state__sub">同じ商品を半年で3回追加すると自動で登録されます</p>
    </div>
  </main>

  <!-- FAB -->
  <button class="fab" id="fabAdd" aria-label="商品を追加">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab nav-tab--active" data-view="list">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span>リスト</span>
    </button>
    <button class="nav-tab" data-view="history">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span>履歴</span>
    </button>
    <button class="nav-tab" data-view="favorites">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>お気に入り</span>
    </button>
  </nav>

  <!-- Modal Backdrop -->
  <div class="modal-backdrop" id="modalBackdrop"></div>

  <!-- Modal: Add/Edit Item -->
  <div class="modal" id="itemModal">
    <div class="modal__handle"></div>
    <h2 class="modal__title" id="modalTitle">商品を追加</h2>
    <form id="itemForm" autocomplete="off">
      <div class="form-group">
        <label for="inputUrl">URLから追加（任意）</label>
        <div class="url-input-row">
          <input type="url" id="inputUrl" placeholder="商品ページのURLを貼り付け">
          <button type="button" class="btn-url-fetch" id="btnFetchUrl" aria-label="URLから読み取り">
            <span class="btn-url-fetch__text">読取</span>
            <span class="btn-url-fetch__loading" style="display:none;">...</span>
          </button>
        </div>
        <div class="url-status" id="urlStatus"></div>
      </div>
      <div class="form-group">
        <label for="inputName">商品名</label>
        <input type="text" id="inputName" placeholder="例: 牛乳" required>
        <div class="suggest-hint" id="suggestHint"></div>
      </div>
      <div class="form-group">
        <label>カテゴリ</label>
        <div class="category-chips" id="categoryChips"></div>
      </div>
      <div class="form-row">
        <div class="form-group form-group--half">
          <label for="inputQuantity">数量</label>
          <div class="quantity-control">
            <button type="button" class="qty-btn" id="qtyMinus">−</button>
            <input type="number" id="inputQuantity" value="1" min="1" max="99">
            <button type="button" class="qty-btn" id="qtyPlus">＋</button>
          </div>
        </div>
        <div class="form-group form-group--half">
          <label for="inputUnit">単位</label>
          <select id="inputUnit"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group form-group--half">
          <label for="inputPrice">価格（税込）</label>
          <div class="price-input">
            <span class="price-input__prefix">¥</span>
            <input type="number" id="inputPrice" placeholder="0" min="0">
          </div>
        </div>
        <div class="form-group form-group--half">
          <label for="inputMemo">メモ</label>
          <input type="text" id="inputMemo" placeholder="例: 低脂肪タイプ">
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--secondary" id="btnCancel">キャンセル</button>
        <button type="submit" class="btn btn--primary" id="btnSubmit">追加</button>
      </div>
    </form>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Confirm Dialog -->
  <div class="confirm-backdrop" id="confirmBackdrop"></div>
  <div class="confirm-dialog" id="confirmDialog">
    <p class="confirm-dialog__message" id="confirmMessage"></p>
    <div class="confirm-dialog__actions">
      <button class="btn btn--secondary" id="confirmCancel">キャンセル</button>
      <button class="btn btn--danger" id="confirmOk">削除</button>
    </div>
  </div>

  <!-- 同期設定モーダル -->
  <div class="modal" id="syncModal">
    <div class="modal__handle"></div>
    <h2 class="modal__title">Notion同期の設定</h2>
    <p class="sync-help">中継サーバーのURLと合言葉を入れてください。1回設定すればこの端末で記憶されます。</p>
    <label class="sync-label">中継サーバーのURL</label>
    <input class="sync-input" id="syncUrl" type="url" placeholder="https://xxxxx.workers.dev" autocomplete="off">
    <label class="sync-label">合言葉</label>
    <input class="sync-input" id="syncKey" type="password" placeholder="合言葉" autocomplete="off">
    <p class="sync-msg" id="syncMsg"></p>
    <div class="sync-actions">
      <button type="button" class="sync-btn sync-btn--ghost" id="syncCancel">閉じる</button>
      <button type="button" class="sync-btn sync-btn--primary" id="syncSave">保存して接続</button>
    </div>
  </div>

  <script src="js/sync.js?v=18"></script>
  <script src="js/todo.js?v=18"></script>
  <script src="js/store.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
